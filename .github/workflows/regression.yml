name: compiler-regression

on:
  push:
    branches: [main, v0.2.9-task-spec-hardening]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate JSON contracts
        run: python -m json.tool schemas/prompt_spec_v1.json > /dev/null
