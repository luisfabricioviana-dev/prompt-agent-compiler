name: Full project regression
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current tree
        run: python -m compileall -q .
      - name: Run current-tree tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  recovered-v0-2-9-public-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce public-safe recovered source
        run: |
          test -d recovered_v0_2_9
          test ! -e recovery/prompt_agent_compiler_v0_2_9_recovered.zip
          test ! -e recovered_v0_2_9/blind_holdout_v0_2_9.json
      - name: Compile recovered v0.2.9 source
        run: python -m compileall -q recovered_v0_2_9
      - name: Run recovered semantic/compiler regression
        run: |
          mv recovered_v0_2_9/test_holdout_protocol_v0_2_9.py /tmp/test_holdout_protocol_v0_2_9.py
          python -m unittest discover -s recovered_v0_2_9 -p 'test_*.py' -v
          cp /tmp/test_holdout_protocol_v0_2_9.py recovered_v0_2_9/test_holdout_protocol_v0_2_9.py
          (
            cd recovered_v0_2_9
            python -m unittest -v \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_prediction_exchange_rejects_unknown_case \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_prediction_exchange_accepts_mapping \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_promotion_rejects_low_semantic_recall \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_promotion_requires_zero_critical_grounding_failures
          )
      - name: Validate public-safe JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("recovered_v0_2_9")
          paths=sorted(root.glob("*.json"))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          if len(paths) != 26:
              raise SystemExit(f"expected_26_public_json_artifacts_got_{len(paths)}")
          print("validated_public_json=26")
          PY
      - name: Verify non-secret frozen components
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("recovered_v0_2_9")
          manifest=json.loads((root/"FREEZE_MANIFEST_v0_2_9.json").read_text(encoding="utf-8"))
          holdout=manifest["files"].get("blind_holdout_v0_2_9.json")
          if holdout != "dcff8740576d0fd870078b6c0fca80e4c027cb8efedf997e0d70126315b33af5":
              raise SystemExit("holdout_hash_metadata_mismatch")
          checked=0
          for name,expected in manifest["files"].items():
              if name=="blind_holdout_v0_2_9.json":
                  continue
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"freeze_drift:{name}")
              checked+=1
          if checked != 11:
              raise SystemExit(f"expected_11_public_freeze_files_got_{checked}")
          print("public_freeze_valid=true checked=11 holdout_content=absent")
          PY
      - name: Re-run recovered oracle and mutation fixtures
        run: |
          python recovered_v0_2_9/evaluate_oracle_v0_2_8.py
          python recovered_v0_2_9/mutation_suite_v0_2_8.py
