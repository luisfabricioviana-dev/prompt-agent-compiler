name: Full project regression
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Assert current-tree test inventory floor
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count = suite.countTestCases()
          print(f"current_tree_discovered_tests={count}")
          if count < 153:
              raise SystemExit(f"current_tree_test_inventory_regressed:{count}")
          PY
      - name: Compile current tree
        run: python -m compileall -q .
      - name: Install v0.2.10 contracts package
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Smoke import installed package
        run: |
          cd /tmp
          python - <<'PY'
          from contracts.canonical_runtime import CanonicalCompilerRuntime
          from contracts.execution_graph_compiler import ExecutionGraphCompiler
          from contracts.runtime_state import RuntimeStateMachine
          print("package_smoke=ok")
          PY
      - name: Enforce scoped release entrypoint inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from contracts.release_entrypoint_scanner import scan_release_entrypoints
          result = scan_release_entrypoints(Path("."))
          print(json.dumps(result, sort_keys=True))
          if result["status"] != "PASS_SCOPED":
              raise SystemExit("release_entrypoint_inventory_drift")
          PY
      - name: Enforce critical release callsite baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          from contracts.critical_release_call_baseline import validate_critical_release_calls
          result = validate_critical_release_calls(Path("."))
          print(result)
          if result["status"] != "PASS_SCOPED":
              raise SystemExit("critical_release_callsite_drift")
          PY
      - name: Enforce lexical owner binding of critical release calls
        run: |
          python - <<'PY'
          from pathlib import Path
          from contracts.critical_release_call_baseline import validate_release_call_owners
          result = validate_release_call_owners(Path("."))
          print(result)
          if result["status"] != "PASS_SCOPED":
              raise SystemExit("critical_release_owner_drift")
          PY
      - name: Enforce critical release import identities
        run: |
          python - <<'PY'
          from pathlib import Path
          from contracts.release_import_identity_gate import validate_critical_import_identity
          result = validate_critical_import_identity(Path("."))
          print(result)
          if result["status"] != "PASS_SCOPED":
              raise SystemExit("critical_release_import_identity_drift")
          PY
      - name: Generate differential release gate evidence
        run: |
          mkdir -p artifacts
          python -m tools.build_release_gate_differential_report > artifacts/release-gate-differential-report.json
          python -m tools.build_release_gate_evidence_manifest
          python - <<'PY'
          import json
          import os
          from contracts.release_gate_evidence_verifier import verify_evidence
          result = verify_evidence(
              "artifacts/release-gate-differential-report.json",
              "artifacts/release-gate-evidence-manifest.json",
              commit_sha=os.environ["GITHUB_SHA"],
              run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
          )
          print(json.dumps(result, sort_keys=True))
          if result["status"] != "PASS_SCOPED":
              raise SystemExit("release_gate_evidence_validation_failed")
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from contracts.release_gate_git_tree_verifier import verify_git_tree_sources
          manifest = json.loads(Path("artifacts/release-gate-evidence-manifest.json").read_text())
          result = verify_git_tree_sources(".", os.environ["GITHUB_SHA"], manifest["source_sha256"])
          print(json.dumps(result, sort_keys=True))
          if result["status"] != "PASS_SCOPED":
              raise SystemExit("git_tree_source_evidence_drift")
          PY
      - name: Upload differential gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-differential-evidence
          path: |
            artifacts/release-gate-differential-report.json
            artifacts/release-gate-evidence-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Run current-tree tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run contract statement coverage gate
        run: python tools/run_contract_coverage_gate.py --minimum 85

  recovered-v0-2-9-public-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify public-safe recovered tree contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reconciliation_v0_2_10 import verify_public_safe_recovered_tree
          result = verify_public_safe_recovered_tree(Path("recovered_v0_2_9"))
          print(json.dumps(result, sort_keys=True))
          if not result["valid"]:
              raise SystemExit("public_safe_recovered_tree_invalid")
          PY
          test ! -e recovery/prompt_agent_compiler_v0_2_9_recovered.zip
      - name: Assert recovered v0.2.9 test inventory floor
        run: |
          python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, "recovered_v0_2_9")
          suite = unittest.defaultTestLoader.discover(
              "recovered_v0_2_9", pattern="test_*.py"
          )
          count = suite.countTestCases()
          print(f"recovered_v0_2_9_discovered_tests={count}")
          if count < 83:
              raise SystemExit(f"recovered_test_inventory_regressed:{count}")
          PY
      - name: Compile recovered v0.2.9 source
        run: python -m compileall -q recovered_v0_2_9
      - name: Run recovered semantic/compiler regression
        run: |
          mv recovered_v0_2_9/test_holdout_protocol_v0_2_9.py /tmp/test_holdout_protocol_v0_2_9.py
          python -m unittest discover -s recovered_v0_2_9 -p 'test_*.py' -v
          cp /tmp/test_holdout_protocol_v0_2_9.py recovered_v0_2_9/test_holdout_protocol_v0_2_9.py
          (
            cd recovered_v0_2_9
            python -m unittest -v \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_prediction_exchange_rejects_unknown_case \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_prediction_exchange_accepts_mapping \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_promotion_rejects_low_semantic_recall \
              test_holdout_protocol_v0_2_9.HoldoutProtocolTests.test_promotion_requires_zero_critical_grounding_failures
          )
      - name: Re-run recovered oracle and mutation fixtures
        run: |
          python recovered_v0_2_9/evaluate_oracle_v0_2_8.py
          python recovered_v0_2_9/mutation_suite_v0_2_8.py
