name: Release gate post-run evidence audit
on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Completed full-regression workflow run ID
        required: true
        type: string
      evidence_commit_sha:
        description: Exact forty-character commit SHA to audit
        required: true
        type: string
      evidence_run_attempt:
        description: Workflow run attempt
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate pinned audit inputs
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_COMMIT_SHA: ${{ inputs.evidence_commit_sha }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
        run: |
          python - <<'PY'
          import os
          import re
          assert re.fullmatch(r"[0-9]+", os.environ["EVIDENCE_RUN_ID"])
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["EVIDENCE_COMMIT_SHA"])
          assert re.fullmatch(r"[0-9]+", os.environ["EVIDENCE_RUN_ATTEMPT"])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.evidence_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify downloaded evidence without side effects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_COMMIT_SHA: ${{ inputs.evidence_commit_sha }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
        run: python -m tools.audit_remote_release_archive
