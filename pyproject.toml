[project]
name = "prompt-agent-compiler"
version = "0.2.10"
description = "Runtime contracts for the Prompt & Agent Compiler"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*"]
exclude = ["recovered_v0_2_9*"]
namespaces = true
